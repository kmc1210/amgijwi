<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 앱(www/index.html)과 같은 정책. 배포 뒤 헤더 검사가 첫 화면의 meta 와 응답 헤더 CSP 가 같은지 본다 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="color-scheme" content="light dark">
<title>암기쥐</title>
<!-- amgijwi.com 첫 화면. 웹 앱은 닫고 iOS 앱으로 옮겼다.
     이 사이트에는 이 안내 · 처리방침(privacy.html) · 도움말(support.html)만 올린다(deploy.yml).
     예전에 이 브라우저에서 쓰던 레시피가 남아 있으면 백업 파일로 꺼낼 수 있게 해 둔다(rescue.js) -->
<style>
  @font-face{font-family:"NeoDGM";src:url(fonts/neodgm.woff2) format("woff2");font-display:swap;}
  :root{--bg:#F3E9DC;--card:#FCF7F1;--ink:#241F1A;--ink-2:#4A423A;--muted:#7A6D62;--line:#4A423A;--drop:#C7BDB1;--accent:#A65E2E;--on-accent:#FCF7F1;}
  @media (prefers-color-scheme: dark){
    :root{--bg:#141210;--card:#241F1A;--ink:#FCF7F1;--ink-2:#C7BDB1;--muted:#9A8F85;--line:#8A7A6A;--drop:#000000;--accent:#C97F4B;--on-accent:#141210;}
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
    line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all;}
  main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 56px) 20px calc(env(safe-area-inset-bottom,0px) + 56px);text-align:center;}
  .px{font-family:"NeoDGM",monospace;font-weight:400;-webkit-font-smoothing:none;}
  .icon{width:96px;height:96px;image-rendering:pixelated;display:block;margin:0 auto 18px;
    box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line),3px 6px 0 0 var(--drop),6px 3px 0 0 var(--drop);}
  h1{font-size:44px;line-height:1.1;margin:0 0 8px;}
  .tag{font-size:16px;color:var(--ink-2);margin:0 0 28px;}
  .box{background:var(--card);text-align:left;padding:18px 20px;margin:0 3px 22px;
    box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line),3px 6px 0 0 var(--drop),6px 3px 0 0 var(--drop);}
  .box h2{font-size:16px;margin:0 0 6px;}
  .box p{font-size:15px;color:var(--ink-2);margin:0 0 10px;}
  .box p:last-child{margin-bottom:0;}
  .btn{display:block;width:100%;border:0;font:inherit;font-size:16px;padding:13px 10px;margin:12px 0 0;cursor:pointer;
    background:var(--accent);color:var(--on-accent);
    box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line);}
  .btn.ghost{background:var(--card);color:var(--ink);}
  textarea{width:100%;min-height:120px;margin-top:12px;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--bg);
    border:2px solid var(--line);padding:8px;}
  .note{font-size:13px;color:var(--muted);}
  footer{font-size:14px;margin-top:34px;}
  footer a{color:var(--accent);font-weight:700;margin:0 8px;}
</style>
</head>
<body>
<main>
  <img class="icon" src="apple-touch-icon.png" alt="">
  <h1 class="px">암기쥐</h1>
  <p class="tag">카페 음료 레시피를 카드로 외우는 아이폰 · 아이패드 앱</p>

  <div class="box">
    <h2 class="px">웹 버전은 닫았어요</h2>
    <p>암기쥐는 이제 아이폰 · 아이패드 앱으로 만나요. App Store 출시를 준비하고 있어요.</p>
  </div>

  <!-- 이 브라우저에 예전 레시피가 남아 있을 때만 rescue.js 가 보여준다 -->
  <div class="box" id="rescue" hidden>
    <h2 class="px">이 브라우저에 남은 레시피</h2>
    <p id="rescueMsg"></p>
    <p class="note">백업 파일을 저장한 뒤, 앱의 <b>설정 → 백업 불러오기 → 백업 파일 선택</b>으로 가져오면 그대로 옮겨져요. 백업 파일에는 PIN 이 들어가지 않아요.</p>
    <button type="button" class="btn" id="rescueFile">백업 파일 저장</button>
    <button type="button" class="btn ghost" id="rescueText">텍스트로 복사</button>
    <textarea id="rescueBox" readonly hidden></textarea>
  </div>

  <footer>
    <a href="support.html">도움말 · 문의</a>
    <a href="privacy.html">개인정보 처리방침</a>
  </footer>
</main>
<script src="rescue.js"></script>
</body>
</html>

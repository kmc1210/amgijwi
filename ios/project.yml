# 암기쥐 iOS 껍데기 — xcodegen generate 로 Amgijwi.xcodeproj 를 만든다.
#
# .xcodeproj 를 저장소에 넣지 않는 이유는 두 가지다.
# 맥 없이도 이 파일만 고치면 프로젝트를 바꿀 수 있고,
# 병합할 때 사람이 읽을 수 없는 충돌이 나지 않는다.

name: Amgijwi

options:
  bundleIdPrefix: com.amgijwi
  # 앱은 한국어로만 되어 있다. 기본값(en)이면 앱스토어 정보 칸에 "언어: 영어" 로 나왔다
  developmentLanguage: ko
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  Amgijwi:
    type: application
    platform: iOS

    sources:
      - path: Sources
      - path: Assets.xcassets
      # 한국어 표시(ko.lproj). 이 폴더가 있어야 앱스토어 "언어" 칸에 한국어로 나온다
      - path: Resources
      # www 를 폴더 통째로 넣는다. 안의 구조가 그대로 보존돼야
      # 스킴 처리기가 js/core.js 같은 경로를 그대로 찾을 수 있다.
      - path: ../www
        name: www
        type: folder

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amgijwi.app
        # 애플 개발자 팀(개인). 비밀 값이 아니다 — 서명된 앱 안에 그대로 들어가 누구나 볼 수 있다.
        # 서명에 필요한 인증서 개인 키와 계정 로그인은 맥 안에만 있고 저장소에는 없다.
        DEVELOPMENT_TEAM: KC5GYLLW34
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "7"
        TARGETED_DEVICE_FAMILY: "1,2"     # 아이폰과 아이패드. 태블릿 최대 폭 작업을 이미 해뒀다
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES

    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 암기쥐
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations:
          - ko

        # 이게 있어야 전체 화면으로 뜬다. 바탕은 기본 테마(크림) 색으로 칠해
        # 첫 화면이 그려지기 전에 흰 화면이 번쩍이지 않게 한다. 색은 Assets.xcassets/LaunchBackground.
        # 테마는 아이폰 다크 모드가 아니라 앱 설정을 따르므로 다크 변형은 두지 않는다.
        UILaunchScreen:
          UIColorName: LaunchBackground

        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate

        # 가로 모드도 받는다. 노치 안전 영역 대응은 CSS 쪽에 이미 들어가 있다.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

        # 암호화를 따로 쓰지 않는다. 심사 때마다 수출 규정을 묻지 않게 미리 밝혀둔다.
        ITSAppUsesNonExemptEncryption: false

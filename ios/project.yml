# 암기쥐 iOS 껍데기 — xcodegen generate 로 Amgijwi.xcodeproj 를 만든다.
#
# .xcodeproj 를 저장소에 넣지 않는 이유는 두 가지다.
# 맥 없이도 이 파일만 고치면 프로젝트를 바꿀 수 있고,
# 병합할 때 사람이 읽을 수 없는 충돌이 나지 않는다.

name: Amgijwi

options:
  bundleIdPrefix: com.amgijwi
  # 앱은 한국어로만 되어 있다. 기본값(en)이면 앱스토어 정보 칸에 "언어: 영어" 로 나왔다
  developmentLanguage: ko
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

# 바깥 라이브러리는 이것 하나다. 보상형 광고(옷장의 "광고 보고 치즈 받기")에만 쓴다 — Sources/AdBridge.swift
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.11.0

# 버전은 앱과 위젯이 같아야 한다(다르면 App Store 가 받지 않는다). 그래서 여기 한 곳에 둔다
settings:
  base:
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "14"

targets:
  Amgijwi:
    type: application
    platform: iOS

    sources:
      - path: Sources
      - path: Assets.xcassets
      # 한국어 표시(ko.lproj). 이 폴더가 있어야 앱스토어 "언어" 칸에 한국어로 나온다
      - path: Resources
      # www 를 폴더 통째로 넣는다. 안의 구조가 그대로 보존돼야
      # 스킴 처리기가 js/core.js 같은 경로를 그대로 찾을 수 있다.
      - path: ../www
        name: www
        type: folder

    dependencies:
      - package: GoogleMobileAds
      # 홈 화면 위젯. 앱 안에 같이 실려 나간다
      - target: AmgijwiWidget

    # 앱과 위젯이 같이 쓰는 칸(App Group). 앱이 위젯에 넘길 요약을 여기에 적는다 — Sources/WidgetBridge.swift
    entitlements:
      path: Amgijwi.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.amgijwi.app

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amgijwi.app
        # 애플 개발자 팀(개인). 비밀 값이 아니다 — 서명된 앱 안에 그대로 들어가 누구나 볼 수 있다.
        # 서명에 필요한 인증서 개인 키와 계정 로그인은 맥 안에만 있고 저장소에는 없다.
        DEVELOPMENT_TEAM: KC5GYLLW34
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"     # 아이폰과 아이패드. 태블릿 최대 폭 작업을 이미 해뒀다
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES

    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 암기쥐
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations:
          - ko

        # ── 보상형 광고(AdMob) ──
        # 여기 ID 들은 비밀 값이 아니다. 앱 안에 그대로 들어가고 광고 요청마다 드러난다.
        # 광고를 끄려면 AmgijwiAdsEnabled 를 false 로 두거나 AmgijwiRewardedUnit 을 비운다(옷장에 광고 버튼이 사라진다).
        # 개발 빌드(Debug)는 광고 단위가 무엇이든 구글의 시험용 광고만 띄운다.
        # 지금은 한국에만 낸다. 유럽(EEA · 영국 · 스위스)에 내려면 그 전에 동의 창(UMP)을 넣어야 한다 —
        # 맞춤형이 아닌 광고도 그곳에서는 동의를 받아야 한다.
        GADApplicationIdentifier: ca-app-pub-2291689741399813~2296012267
        AmgijwiAdsEnabled: true
        AmgijwiRewardedUnit: ca-app-pub-2291689741399813/9658487809
        # 광고를 보고 앱을 설치했는지를 개인을 식별하지 않고 세는 애플 방식(SKAdNetwork)에 쓰는 구매자 목록.
        # 구글이 안내하는 목록 그대로다: https://developers.google.com/admob/ios/3p-skadnetworks
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: 22mmun2rn5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: 2u9pt9hc89.skadnetwork
          - SKAdNetworkIdentifier: 3qcr597p9d.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: 3rd42ekr43.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: 4468km3ulz.skadnetwork
          - SKAdNetworkIdentifier: 44jx6755aq.skadnetwork
          - SKAdNetworkIdentifier: 47vhws6wlr.skadnetwork
          - SKAdNetworkIdentifier: 4dzt52r2t5.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 578prtvx9j.skadnetwork
          - SKAdNetworkIdentifier: 7ug5zh24hu.skadnetwork
          - SKAdNetworkIdentifier: 8c4e2ghe7u.skadnetwork
          - SKAdNetworkIdentifier: 8s468mfl3y.skadnetwork
          - SKAdNetworkIdentifier: 97r2b46745.skadnetwork
          - SKAdNetworkIdentifier: 9t245vhmpl.skadnetwork
          - SKAdNetworkIdentifier: a2p9lx4jpn.skadnetwork
          - SKAdNetworkIdentifier: c3frkrj4fj.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: e5fvkxwrpn.skadnetwork
          - SKAdNetworkIdentifier: f38h382jlk.skadnetwork
          - SKAdNetworkIdentifier: gta9lk7p23.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
          - SKAdNetworkIdentifier: k674qkevps.skadnetwork
          - SKAdNetworkIdentifier: kbd757ywx3.skadnetwork
          - SKAdNetworkIdentifier: kbmxgpxpgc.skadnetwork
          - SKAdNetworkIdentifier: klf5c3l5u5.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: mlmmfzh3r3.skadnetwork
          - SKAdNetworkIdentifier: n38lu8286q.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: ppxm28t8ap.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
          - SKAdNetworkIdentifier: su67r6k2v3.skadnetwork
          - SKAdNetworkIdentifier: t38b2kh725.skadnetwork
          - SKAdNetworkIdentifier: tl55sbb4fm.skadnetwork
          - SKAdNetworkIdentifier: uw77j35x4d.skadnetwork
          - SKAdNetworkIdentifier: v4nxqhlyqp.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: v9wttpbfk9.skadnetwork
          - SKAdNetworkIdentifier: vutu7akeur.skadnetwork
          - SKAdNetworkIdentifier: wg4vff78zm.skadnetwork
          - SKAdNetworkIdentifier: wzmmz9fp6w.skadnetwork
          - SKAdNetworkIdentifier: y5ghdn5j9k.skadnetwork
          - SKAdNetworkIdentifier: yclnxrl5pm.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork

        # 이게 있어야 전체 화면으로 뜬다. 바탕은 기본 테마(크림) 색으로 칠해
        # 첫 화면이 그려지기 전에 흰 화면이 번쩍이지 않게 한다. 색은 Assets.xcassets/LaunchBackground.
        # 테마는 아이폰 다크 모드가 아니라 앱 설정을 따르므로 다크 변형은 두지 않는다.
        UILaunchScreen:
          UIColorName: LaunchBackground

        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate

        # 가로 모드도 받는다. 노치 안전 영역 대응은 CSS 쪽에 이미 들어가 있다.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

        # 암호화를 따로 쓰지 않는다. 심사 때마다 수출 규정을 묻지 않게 미리 밝혀둔다.
        ITSAppUsesNonExemptEncryption: false

  # 홈 화면 위젯(쥐돌이 · 오늘 외울 잔 수). 앱이 App Group 에 적어 둔 요약만 읽는다 — Widget/AmgijwiWidget.swift
  AmgijwiWidget:
    type: app-extension
    platform: iOS

    sources:
      - path: Widget

    entitlements:
      path: Widget/AmgijwiWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.amgijwi.app

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amgijwi.app.widget
        DEVELOPMENT_TEAM: KC5GYLLW34
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SKIP_INSTALL: YES

    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 암기쥐
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
